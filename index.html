<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>行程</title>
<meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="行程">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
*, *::before, *::after { box-sizing: border-box; }
:root {
  --bg: #f4f4f2;
  --card: #ffffff;
  --card-2: #fafaf8;
  --line: #e5e4df;
  --line-2: #efeee9;
  --text: #17181b;
  --muted: #71727a;
  --muted-2: #9b9ca3;
  --accent: #0f766e;
  --accent-weak: #e7f3f1;
  --sun: #d98300;
  --moon: #4f5fd0;
  --danger: #c2410c;
  --shadow: 0 1px 2px rgba(20, 20, 25, .05), 0 10px 30px -18px rgba(20, 20, 25, .35);
  --r: 14px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115;
    --card: #171a20;
    --card-2: #1b1f26;
    --line: #272b33;
    --line-2: #22262d;
    --text: #e9eaee;
    --muted: #9aa0ab;
    --muted-2: #767c88;
    --accent: #4fd1c5;
    --accent-weak: #14312f;
    --sun: #f0b429;
    --moon: #9aa8ff;
    --danger: #fb923c;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5);
  }
}
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-wrap: break-word;
  padding-bottom: calc(28px + var(--sab));
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: var(--accent); text-decoration: none; }
h1, h2, h3, p, ol, ul { margin: 0; }

/* ---------- 顶栏 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  padding: calc(var(--sat) + 10px) 16px 8px;
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  -webkit-backdrop-filter: saturate(180%) blur(18px);
  backdrop-filter: saturate(180%) blur(18px);
  border-bottom: 1px solid var(--line-2);
}
.topbar-inner { display: flex; align-items: flex-start; gap: 10px; max-width: 720px; margin: 0 auto; }
.tb-text { flex: 1; min-width: 0; }
.tb-title { font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
.tb-sub { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.tb-today {
  flex: none; font-size: 13px; font-weight: 600; color: var(--accent);
  border: 1px solid var(--line);
  border: 1px solid color-mix(in srgb, var(--accent) 32%, transparent);
  background: var(--accent-weak);
  border-radius: 999px; padding: 6px 12px; margin-top: 2px;
}
.segmented {
  display: flex; gap: 4px; max-width: 720px; margin: 8px auto 0;
  background: var(--line-2); border-radius: 11px; padding: 3px;
}
.segmented button {
  flex: 1; text-align: center; font-size: 13.5px; font-weight: 600;
  color: var(--muted); padding: 7px 0; border-radius: 8.5px;
}
.segmented button[aria-selected="true"] {
  background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
}

main { max-width: 720px; margin: 0 auto; padding: 12px 14px 0; }
.view[hidden] { display: none; }

/* ---------- 行程概览卡 ---------- */
.tripcard {
  background: var(--card);
  background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 12%, var(--card)), var(--card) 62%);
  border: 1px solid var(--line); border-radius: var(--r);
  padding: 13px 14px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.tc-title { font-size: 15px; font-weight: 700; }
.tc-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.tc-count { margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--accent); }

/* ---------- 日期条 ---------- */
.daystrip {
  position: sticky; top: var(--topbar-h, 96px); z-index: 20;
  display: flex; gap: 6px; overflow-x: auto; padding: 6px 0 8px;
  margin: 0 -14px 6px; padding-left: 14px; padding-right: 14px;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
  background: linear-gradient(var(--bg) 72%, transparent);
}
.daystrip::-webkit-scrollbar { display: none; }
.chip {
  flex: none; font-size: 12.5px; font-weight: 650; color: var(--muted);
  border: 1px solid var(--line); background: var(--card);
  padding: 6px 10px; border-radius: 999px; line-height: 1.25;
}
.chip b { font-weight: 800; color: var(--text); margin-right: 3px; }
.chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip.active b { color: #fff; }

/* ---------- 每天 ---------- */
.day {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: var(--shadow); margin-bottom: 14px; overflow: hidden;
  scroll-margin-top: calc(var(--topbar-h, 96px) + 44px);
}
.day.today { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.day-head { padding: 12px 14px 10px; border-bottom: 1px solid var(--line-2); }
.dh-row1 { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.dh-dnum {
  font-weight: 800; font-size: 11.5px; letter-spacing: .04em;
  background: var(--accent-weak); color: var(--accent);
  border-radius: 6px; padding: 2px 6px;
}
.dh-today { font-size: 11px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 6px; padding: 2px 6px; }
.dh-spacer { flex: 1; }
.dh-copy {
  font-size: 12px; font-weight: 650; color: var(--accent);
  border: 1px solid color-mix(in srgb, var(--accent) 34%, transparent);
  border-radius: 8px; padding: 4px 9px; background: var(--card);
}
.dh-title { font-size: 16.5px; font-weight: 700; margin-top: 6px; letter-spacing: -.01em; }
.dh-note { font-size: 12.5px; color: var(--muted); margin-top: 5px; }
.dh-astro { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
.pill {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11.5px; font-weight: 600; color: var(--muted);
  background: var(--card-2); border: 1px solid var(--line-2);
  border-radius: 7px; padding: 3px 7px; font-variant-numeric: tabular-nums;
}
.pill.sun { color: var(--sun); }
.pill.moon { color: var(--moon); }
.pill i { font-style: normal; font-size: 11px; }

/* ---------- 时间轴 ---------- */
.tl { list-style: none; padding: 12px 14px 4px; }
.tl-divider { display: flex; align-items: center; gap: 8px; margin: 4px 0 14px; }
.tl-divider::before, .tl-divider::after { content: ""; height: 1px; background: var(--line); flex: 1; }
.tl-divider .lbl {
  font-size: 11.5px; font-weight: 750; letter-spacing: .01em; white-space: nowrap;
  color: var(--accent); background: var(--accent-weak); border-radius: 6px; padding: 3px 9px;
}
.it {
  display: grid; grid-template-columns: 42px 14px 1fr; gap: 0 9px;
  position: relative; padding-bottom: 16px;
}
.it-time { font-size: 13px; font-weight: 650; color: var(--text); text-align: right; padding-top: 1px; font-variant-numeric: tabular-nums; }
.it-rail { position: relative; display: flex; justify-content: center; }
.it-rail::before { content: ""; position: absolute; top: 13px; bottom: -16px; width: 2px; background: var(--line-2); }
.it:last-child .it-rail::before { display: none; }
.it-dot {
  width: 11px; height: 11px; border-radius: 50%; margin-top: 4px; flex: none;
  background: var(--accent); box-shadow: 0 0 0 3px var(--card);
  border: 2px solid var(--card);
}
.it[data-type="transport"] .it-dot { background: #3b82f6; }
.it[data-type="food"] .it-dot { background: #ea580c; }
.it[data-type="stay"] .it-dot { background: #7c3aed; }
.it[data-type="shop"] .it-dot { background: #db2777; }
.it[data-type="sight"] .it-dot { background: var(--accent); }
.it[data-type="other"] .it-dot { background: var(--muted-2); }
.it-body { min-width: 0; padding-bottom: 2px; padding-right: 30px; }
.it-transit { font-size: 11.5px; color: var(--muted-2); margin-bottom: 1px; }
.it-name { font-size: 15.5px; font-weight: 650; line-height: 1.35; letter-spacing: -.005em; }
.it-meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.it-tag {
  font-size: 11px; font-weight: 600; color: var(--muted);
  background: var(--card-2); border: 1px solid var(--line-2);
  border-radius: 5px; padding: 1.5px 5px;
}
.it-note { font-size: 12.5px; color: var(--muted); margin-top: 5px; }
.it.open .it-note { display: block; }
.it-check {
  position: absolute; right: -2px; top: 0; width: 30px; height: 30px;
  border-radius: 50%; display: grid; place-items: center;
  color: var(--muted-2); font-size: 13px; border: 1px solid var(--line);
  background: var(--card); opacity: .9;
}
.it.done .it-check { background: var(--accent); border-color: var(--accent); color: #fff; }
.it.done .it-name { color: var(--muted-2); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.it.done .it-dot { opacity: .45; }
.dh-progress { font-weight: 650; }

/* ---------- 总览（日历卡） ---------- */
.ov-head {
  background: var(--card);
  background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 12%, var(--card)), var(--card) 62%);
  border: 1px solid var(--line); border-radius: var(--r);
  padding: 14px 15px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.ovh-title { font-size: 17px; font-weight: 750; letter-spacing: -.01em; }
.ovh-meta { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.ovh-badge {
  display: inline-block; margin-top: 9px; font-size: 12.5px; font-weight: 700;
  color: var(--accent); background: var(--accent-weak); border-radius: 7px; padding: 3px 9px;
}
.ov-card {
  display: grid; grid-template-columns: 46px 1fr; gap: 12px; width: 100%;
  text-align: left; align-items: start;
  padding: 11px 13px; margin-bottom: 8px;
  background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--c, var(--accent));
  border-radius: 12px; box-shadow: var(--shadow); font: inherit; color: inherit;
}
.ov-card:active { transform: scale(.995); }
.ov-card.today { background: linear-gradient(180deg, var(--accent-weak), var(--card)); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.ov-date { text-align: center; padding-top: 1px; }
.ov-day { font-size: 21px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
.ov-mon { font-size: 9px; font-weight: 700; letter-spacing: .11em; color: var(--muted-2); margin-top: 1px; }
.ov-wd { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
.ov-body { min-width: 0; }
.ov-row1 { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.ov-d { font-size: 10.5px; font-weight: 800; color: var(--muted); background: var(--card-2); border: 1px solid var(--line-2); border-radius: 4px; padding: 1px 5px; }
.ov-tag { font-size: 10px; font-weight: 700; color: var(--accent); background: var(--accent-weak); border-radius: 4px; padding: 1px 5px; }
.ov-today { font-size: 10px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 4px; padding: 1px 5px; }
.ov-title { font-size: 14.5px; font-weight: 650; margin-top: 4px; line-height: 1.35; }
.ov-sum { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
/* ---------- 分类汇总 ---------- */
.snap {
  position: relative; width: 100%; height: 168px; border-radius: 10px; overflow: hidden;
  background: #e9e6e0; margin: 2px 0 10px; border: 1px solid var(--line-2);
}
.snap-sm { height: 112px; margin: 6px 0 6px; }
@media (prefers-color-scheme: dark) {
  .snap { background: #14171c; }
  .snap img { filter: invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.7); }
}
/* ---------- 全屏地图 ---------- */
.mapmodal { position: fixed; inset: 0; z-index: 70; display: none; }
.mapmodal.show { display: block; }
.mm-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, .55); }
.mm-panel { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
.mm-head { display: flex; align-items: center; gap: 10px; padding: calc(var(--sat) + 10px) 14px 10px; }
.mm-cap { flex: 1; min-width: 0; font-size: 14px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mm-close { flex: none; font-size: 13px; font-weight: 650; color: var(--accent); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px 13px; }
.mm-canvas { position: relative; flex: 1; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; background: #e9e6e0; }
.mm-tiles { position: absolute; inset: 0; }
.mm-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.mm-marks { position: absolute; inset: 0; pointer-events: none; }
.mm-dot { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 1px 5px rgba(0, 0, 0, .4); }
.mm-ctl { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
.mm-ctl button { width: 38px; height: 38px; border-radius: 10px; font-size: 18px; font-weight: 700; background: var(--card); color: var(--text); border: 1px solid var(--line); box-shadow: 0 1px 4px rgba(0, 0, 0, .18); }
.mm-ctl button:active { transform: scale(.95); }
@media (prefers-color-scheme: dark) {
  .mm-canvas { background: #14171c; }
  .mm-tiles img { filter: invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.7); }
}
.snap.tappable { cursor: pointer; }
.snap.tappable::after {
  content: "点击放大"; position: absolute; right: 6px; top: 6px;
  font-size: 10px; font-weight: 600; color: #fff; background: rgba(0, 0, 0, .55);
  border-radius: 4px; padding: 1px 5px; pointer-events: none;
}

.snap-cap {
  position: absolute; left: 5px; bottom: 4px; font-size: 9.5px; color: #444;
  background: rgba(255,255,255,.82); border-radius: 3px; padding: 0 4px; pointer-events: none;
}
@media (prefers-color-scheme: dark) { .snap-cap { color: #ddd; background: rgba(0,0,0,.55); } }
.tip-row { padding: 9px 0; border-bottom: 1px dashed var(--line-2); }
.tip-row:last-child { border-bottom: 0; }
.tip-head { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
.tip-name { font-size: 14px; font-weight: 700; }
.tip-cat { font-size: 10.5px; font-weight: 700; color: var(--accent); background: var(--accent-weak); border-radius: 4px; padding: 1px 6px; }
.tip-addr { font-size: 11.5px; color: var(--muted-2); margin-top: 2px; font-variant-numeric: tabular-nums; }
.tip-note { font-size: 12.5px; color: var(--muted); line-height: 1.6; margin-top: 3px; }
.fd-row { display: grid; grid-template-columns: 26px 1fr 46px; gap: 9px; align-items: start; padding: 8px 0; border-bottom: 1px dashed var(--line-2); }
.fd-view { font-size: 9.5px; font-weight: 800; color: #b45309; background: #fef3c7; border-radius: 4px; padding: 1px 5px; margin-left: 4px; }
@media (prefers-color-scheme: dark) { .fd-view { color: #fbbf24; background: #422006; } }\n.fd-thumb { width: 46px; height: 46px; border-radius: 9px; object-fit: cover; display: block; background: var(--card-2); cursor: pointer; }
.fd-row:last-child { border-bottom: 0; }
.fd-slot { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #fff; margin-top: 1px; }
.fd-slot.s-b { background: #d97706; }
.fd-slot.s-l { background: #0f766e; }
.fd-slot.s-d { background: #2563eb; }
.fd-slot.s-n { background: #7c3aed; }
.fd-body { min-width: 0; }
.fd-line1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.fd-name { font-size: 13.5px; font-weight: 650; }
.fd-meta { font-size: 11px; color: var(--muted); margin-left: auto; white-space: nowrap; }
.fd-note2 { font-size: 12px; color: var(--muted); line-height: 1.55; margin-top: 3px; }
.fd-note { font-size: 12px; color: var(--muted); line-height: 1.55; margin-bottom: 4px; }
.gd-row.fac { padding: 3px 0; }
.gd-row.fac.long { display: block; }
.gd-row.fac.long .k { width: auto; color: var(--accent); font-weight: 700; margin-bottom: 1px; }
.spot { margin-top: 8px; }
.spot-label { font-size: 11.5px; font-weight: 700; color: var(--accent); margin-bottom: 2px; }
.spot-note { font-size: 12px; color: var(--muted); line-height: 1.6; margin-top: 4px; }

.gd-head { display: flex; gap: 11px; align-items: center; margin-bottom: 7px; }
.gd-ico-img { width: 46px; height: 46px; flex: none; border-radius: 12px; object-fit: cover; border: 1px solid var(--line-2); }
.ph-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 2px 0 11px; }
.ph-strip img { width: 100%; height: 96px; object-fit: cover; border-radius: 9px; display: block; background: var(--card-2); cursor: pointer; }
.ph-strip img:active { opacity: .85; }
.sh-img { width: 100%; border-radius: 12px; display: block; margin: 8px 0 10px; }
.gd-hw { min-width: 0; flex: 1; }
.gd-ico {
  width: 42px; height: 42px; flex: none; border-radius: 12px;
  display: grid; place-items: center; font-size: 21px; line-height: 1;
  background: linear-gradient(150deg, color-mix(in srgb, var(--accent) 15%, var(--card-2)), var(--card-2));
  border: 1px solid var(--line-2);
}
.gst { font-size: 10.5px; font-weight: 800; border-radius: 5px; padding: 1px 6px; color: #b45309; background: #fef3c7; }
@media (prefers-color-scheme: dark) { .gst { color: #fbbf24; background: #422006; } }
.gst.ok { color: #0f766e; background: var(--accent-weak); }
.gd-dates { font-size: 11.5px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
.gd-dist { font-size: 11.5px; color: var(--muted-2); margin-top: 3px; font-variant-numeric: tabular-nums; }

.gd-daysep { font-size: 11.5px; font-weight: 800; letter-spacing: .06em; color: var(--muted-2); margin: 16px 2px 7px; text-transform: none; }
.gd-daysep:first-child { margin-top: 2px; }
.gd-card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: var(--shadow); padding: 13px 14px; margin-bottom: 11px;
}
.gd-h { font-size: 15px; font-weight: 700; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.gd-day { font-size: 11.5px; font-weight: 700; color: var(--accent); background: var(--accent-weak); border-radius: 5px; padding: 1px 6px; }
.gd-leg {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 10px;
  padding: 9px 0; border-bottom: 1px dashed var(--line-2);
}
.gd-leg:last-of-type { border-bottom: 0; }
.gd-leg .no { font-size: 11.5px; font-weight: 800; color: var(--accent); }
.gd-leg .route { font-size: 13.5px; font-weight: 600; }
.gd-leg .times { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.gd-leg .dur { font-size: 11px; color: var(--muted-2); }
.gd-list { margin: 10px 0 0; padding-left: 18px; }
.gd-list li { font-size: 12.5px; line-height: 1.6; color: var(--text); margin-bottom: 4px; }
.gd-opt { padding: 9px 0; border-bottom: 1px dashed var(--line-2); }
.gd-opt:last-of-type { border-bottom: 0; }
.gd-opt-h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.gd-mode { font-size: 11px; font-weight: 800; color: #fff; background: var(--accent); border-radius: 5px; padding: 1.5px 6px; }
.gd-mode.walk { background: #7c3aed; }
.gd-mode.drive { background: #0f766e; }
.gd-mode.transit { background: #2563eb; }
.gd-mode.taxi { background: #ea580c; }
.gd-opt-h .time { font-size: 12.5px; font-weight: 650; }
.gd-opt-h .cost { font-size: 11.5px; color: var(--muted); margin-left: auto; }
.gd-opt .detail { font-size: 12.5px; color: var(--muted); line-height: 1.6; margin-top: 4px; }

/* ---------- 地图 ---------- */
.mapwrap { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 10px 10px 12px; }
.mapchips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; }

.mchip { flex: none; font-size: 12px; font-weight: 650; border-radius: 999px; padding: 4px 9px; border: 1px solid var(--line); color: var(--text); background: var(--card); display: inline-flex; align-items: center; gap: 5px; }
.mchip .dot { width: 7px; height: 7px; border-radius: 50%; }

.mapcanvas {
  position: relative; height: 40vh; min-height: 230px; max-height: 400px;

.maptiles img {
  position: absolute; width: 256px; height: 256px; max-width: none;
  user-select: none; -webkit-user-drag: none; pointer-events: none;
}
.mapoverlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.mapmarkers { position: absolute; inset: 0; }
.mk {
  position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px;
  border-radius: 50%; display: grid; place-items: center;
  font-size: 11.5px; font-weight: 800; color: #fff; line-height: 1;
  border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .35);
  cursor: pointer; transform-origin: center;
}
.mk.small { width: 14px; height: 14px; margin: -7px 0 0 -7px; border-width: 1.5px; font-size: 0; }
.mk.sel { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 45%, transparent), 0 2px 6px rgba(0,0,0,.35); z-index: 3; transform: scale(1.15); }
.mk.tap { animation: mkpop .35s ease-out; }
@keyframes mkpop { 0% { transform: scale(.6); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
.mapctl { position: absolute; right: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 5px; }
.mapctl button {
  width: 34px; height: 34px; border-radius: 9px; font-size: 17px; font-weight: 700;
  background: color-mix(in srgb, var(--card) 92%, transparent);
  color: var(--text); border: 1px solid var(--line);

.mapattr {
  position: absolute; left: 6px; bottom: 5px; font-size: 10px; color: #444;
  background: rgba(255, 255, 255, .78); border-radius: 4px; padding: 1px 4px; pointer-events: none;
}
@media (prefers-color-scheme: dark) { .mapattr { color: #ddd; background: rgba(0, 0, 0, .5); } }
.mapempty {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 13px; color: var(--muted-2); text-align: center; padding: 20px;
}
.mapfoot { display: flex; flex-direction: column; gap: 3px; margin-top: 8px; font-size: 11.5px; color: var(--muted-2); }
.mapfoot a { font-weight: 650; }

/* 地图下的当天行程列表 */
.maplist {
  margin-top: 10px; max-height: 48vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);

}

}

  display: grid; grid-template-columns: 44px 9px 1fr auto; gap: 8px; align-items: center;
  padding: 8px 14px; cursor: pointer;
}
.ml-row:active { background: var(--card-2); }
.ml-row.sel { background: var(--accent-weak); }

.sheet {

/* ---------- toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(24px + var(--sab)); transform: translate(-50%, 14px);
  z-index: 80; background: #1c1f26; color: #fff; font-size: 13px; font-weight: 600;
  padding: 9px 16px; border-radius: 999px; opacity: 0; pointer-events: none;
  transition: opacity .2s ease, transform .2s ease; max-width: 86vw; text-align: center;

.foot { text-align: center; font-size: 11.5px; color: var(--muted-2); padding: 18px 0 6px; line-height: 1.7; }

<header class="topbar">
  <div class="topbar-inner">

<main>
  <section class="view" id="view-overview">
    <div class="ov-head">
      <div class="ovh-title" id="ovTitle"></div>

  <section class="view" id="view-map" hidden>
    <div class="mapwrap">
      <div class="mapchips" id="mapchips"></div>

        <div class="maptiles" id="mapTiles"></div>

      底图需要联网，断网时只显示点位。<br>

<script src="trip-data.js"></script>
<script>
(function () {
  'use strict';

  /* =====================================================================
   * 0. 基础
   * ===================================================================== */
  const TRIP = window.TRIP || { days: [] };
  const TZ = TRIP.timezone || 'Asia/Tokyo';
  const DAY_MS = 86400000;
  const MIN_MS = 60000;
  const RAD = Math.PI / 180;
  const DEG = 180 / Math.PI;
  const sin = Math.sin, cos = Math.cos, tan = Math.tan;
  const asin = Math.asin, acos = Math.acos, atan2 = Math.atan2;

  const $ = (s, r) => (r || document).querySelector(s);
  const el = (tag, cls, html) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  };
  const pad2 = n => (n < 10 ? '0' + n : '' + n);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const BUILD = '2026-10-31 00:00';   // 部署时由 deploy.ps1 自动改写
const DAY_COLORS = ['#0f766e', '#e07a1f', '#6d5bd0', '#c2410c', '#2563eb', '#db2777', '#4d7c0f', '#0891b2', '#a16207', '#7c3aed'];
  const TYPE_LABEL = { transport: '交通', sight: '景点', food: '吃', stay: '住宿', shop: '购物', other: '其他' };

  /* =====================================================================
   * 1. 时区工具（不引第三方库）
   * ===================================================================== */
  const fmtTimeCache = {};
  function tzFormatter(tz) {
    if (!fmtTimeCache[tz]) {
      fmtTimeCache[tz] = new Intl.DateTimeFormat('en-GB', {
        timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit',
        day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
    }
    return fmtTimeCache[tz];
  }

  // 某一 UTC 瞬间在该时区的偏移量（毫秒，localWall - utc）
  function tzOffset(ms, tz) {
    const parts = tzFormatter(tz).formatToParts(new Date(ms));
    const p = {};
    for (let i = 0; i < parts.length; i++) p[parts[i].type] = parts[i].value;
    const wall = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second);
    return wall - Math.floor(ms / 1000) * 1000;
  }

  // 时区里某天某刻 -> UTC 毫秒
  function zoned(dateStr, hh, mm) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const base = Date.UTC(y, m - 1, d, hh || 0, mm || 0, 0);
    let ms = base - tzOffset(base, TZ);
    ms = base - tzOffset(ms, TZ);
    return ms;
  }

  function fmtHM(ms) {
    if (ms == null || !isFinite(ms)) return '—';
    if (!fmtHM.formatter) {
      fmtHM.formatter = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hourCycle: 'h23', hour: '2-digit', minute: '2-digit' });
    }
    const parts = fmtHM.formatter.formatToParts(new Date(ms));
    const p = {};
    for (let i = 0; i < parts.length; i++) p[parts[i].type] = parts[i].value;
    return p.hour + ':' + p.minute;
  }

  function dateParts(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    return { y, m, d };
  }
  function weekdayCN(dateStr) {
    const p = dateParts(dateStr);
    const w = new Date(Date.UTC(p.y, p.m - 1, p.d)).getUTCDay();
    return ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][w];
  }
  function todayInTZ() {
    if (!todayInTZ.formatter) {
      todayInTZ.formatter = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
    }
    const parts = todayInTZ.formatter.formatToParts(new Date());
    const p = {};
    for (let i = 0; i < parts.length; i++) p[parts[i].type] = parts[i].value;
    return p.year + '-' + p.month + '-' + p.day;
  }
  function dayDiff(a, b) {
    const [ay, am, ad] = a.split('-').map(Number);
    const [by, bm, bd] = b.split('-').map(Number);
    return Math.round((Date.UTC(by, bm - 1, bd) - Date.UTC(ay, am - 1, ad)) / DAY_MS);
  }

  /* =====================================================================
   * 2. 天文算法
   * ===================================================================== */
  const J1970 = 2440588, J2000 = 2451545, OBLIQ = RAD * 23.4397;
  const toJulian = ms => ms / DAY_MS - 0.5 + J1970;
  const toDays = ms => toJulian(ms) - J2000;

  function sunCoords(d) {
    const M = RAD * (357.5291 + 0.98560028 * d);
    const C = RAD * (1.9148 * sin(M) + 0.02 * sin(2 * M) + 0.0003 * sin(3 * M));
    const L = M + C + RAD * 102.9372 + Math.PI; // 黄经（含近日点 102.9372° 与 π 修正）
    return {
      ra: atan2(sin(L) * cos(OBLIQ), cos(L)),
      dec: asin(sin(OBLIQ) * sin(L))
    };
  }

  function moonCoords(d) {
    const L = RAD * (218.316 + 13.176396 * d);         // 月亮平黄经
    const M = RAD * (134.963 + 13.064993 * d);         // 月亮平近点角
    const F = RAD * (93.272 + 13.229350 * d);          // 升交点角距
    const Ms = RAD * (357.5291 + 0.98560028 * d);      // 太阳平近点角
    const Ls = RAD * (282.9404 + 4.70935e-5 * d) + Ms; // 太阳平黄经
    const D = L - Ls;                                  // 平距角
    const N = RAD * (125.1228 - 0.0529538083 * d);     // 升交点黄经
    const Fn = L - N;

    let l = L + RAD * 6.289 * sin(M);
    let b = RAD * 5.128 * sin(F);
    // 主要摄动项：不加这些，月升月落会差十几分钟
    l += RAD * (
      -1.274 * sin(M - 2 * D) + 0.658 * sin(2 * D) - 0.186 * sin(Ms)
      - 0.059 * sin(2 * M - 2 * D) - 0.057 * sin(M - 2 * D + Ms)
      + 0.053 * sin(M + 2 * D) + 0.046 * sin(2 * D - Ms)
      + 0.041 * sin(M - Ms) - 0.035 * sin(D) - 0.031 * sin(M + Ms)
      - 0.015 * sin(2 * Fn - 2 * D) + 0.011 * sin(M - 4 * D)
    );
    b += RAD * (
      -0.173 * sin(Fn - 2 * D) - 0.055 * sin(M - Fn - 2 * D)
      - 0.046 * sin(M + Fn - 2 * D) + 0.033 * sin(Fn + 2 * D)
      + 0.017 * sin(2 * M + Fn)
    );
    const dist = 385001 - 20905 * cos(M); // km
    return {
      ra: atan2(sin(l) * cos(OBLIQ) - tan(b) * sin(OBLIQ), cos(l)),
      dec: asin(sin(b) * cos(OBLIQ) + cos(b) * sin(OBLIQ) * sin(l)),
      dist,
      parallax: asin(6378.14 / dist)  // rad
    };
  }

  function siderealTime(d, lw) { return RAD * (280.16 + 360.9856235 * d) - lw; }

  function altitudeOf(body, ms, lat, lng) {
    const d = toDays(ms);
    const c = body === 'moon' ? moonCoords(d) : sunCoords(d);
    const phi = RAD * lat;
    const H = siderealTime(d, -RAD * lng) - c.ra;
    return { alt: asin(sin(phi) * sin(c.dec) + cos(phi) * cos(c.dec) * cos(H)), c, d, H, phi };
  }

  // 返回「南为 0、向西为正」的方位角（弧度），调用方再转成北偏东
  function azimuthOf(ra, dec, d, lat, lng) {
    const phi = RAD * lat;
    const H = siderealTime(d, -RAD * lng) - ra;
    return atan2(sin(H), cos(H) * sin(phi) - tan(dec) * cos(phi));
  }

  // 在 [t0,t1] 内找天体高度穿过 h0 的时刻；dir=1 升起，dir=-1 落下
  function crossings(body, t0, t1, lat, lng, h0) {
    const out = [];
    const step = 10 * MIN_MS;
    let prevT = t0;
    let prev = altitudeOf(body, t0, lat, lng).alt - h0;
    for (let t = t0 + step; t <= t1 + 1; t += step) {
      const tt = Math.min(t, t1);
      const cur = altitudeOf(body, tt, lat, lng).alt - h0;
      if (prev * cur < 0) {
        let a = prevT, b = tt, fa = prev;
        for (let i = 0; i < 44; i++) {
          const m = (a + b) / 2;
          const fm = altitudeOf(body, m, lat, lng).alt - h0;
          if (fa * fm <= 0) { b = m; } else { a = m; fa = fm; }
        }
        out.push({ t: (a + b) / 2, dir: cur > 0 ? 1 : -1 });
      }
      prevT = tt; prev = cur;
      if (tt >= t1) break;
    }
    return out;
  }

  function phaseInfo(ms) {
    const d = toDays(ms);
    const s = sunCoords(d), m = moonCoords(d);
    const sdist = 149598000;
    const phi = acos(sin(s.dec) * sin(m.dec) + cos(s.dec) * cos(m.dec) * cos(s.ra - m.ra));
    const inc = atan2(sdist * sin(phi), m.dist - sdist * cos(phi));
    const angle = atan2(cos(s.dec) * sin(s.ra - m.ra), sin(s.dec) * cos(m.dec) - cos(s.dec) * sin(m.dec) * cos(s.ra - m.ra));
    const fraction = (1 + cos(inc)) / 2;
    const phase = 0.5 + 0.5 * inc * (angle < 0 ? -1 : 1) / Math.PI;
    return { fraction, phase, age: phase * 29.53059 };
  }

  function phaseName(phase) {
    if (phase < 0.02 || phase > 0.98) return '新月';
    if (phase < 0.23) return '娥眉月';
    if (phase < 0.27) return '上弦月';
    if (phase < 0.48) return '盈凸月';
    if (phase < 0.52) return '满月';
    if (phase < 0.73) return '亏凸月';
    if (phase < 0.77) return '下弦月';
    return '残月';
  }

  const cacheAstro = {};
  function astroFor(day) {
    const key = day.date + '|' + (day.base ? day.base.lat + ',' + day.base.lng : '');
    if (cacheAstro[key]) return cacheAstro[key];
    const lat = day.base ? day.base.lat : 0;
    const lng = day.base ? day.base.lng : 0;
    const t0 = zoned(day.date, 0, 0);
    const t1 = t0 + DAY_MS;

    const sunC = crossings('sun', t0, t1, lat, lng, -0.833 * RAD);
    const rise = sunC.find(c => c.dir === 1);
    const set = sunC.find(c => c.dir === -1);

    const goldRise = crossings('sun', t0, t1, lat, lng, -4 * RAD).find(c => c.dir === 1);
    const goldSet = crossings('sun', t0, t1, lat, lng, 6 * RAD).find(c => c.dir === -1);
    const goldEndRise = crossings('sun', t0, t1, lat, lng, 6 * RAD).find(c => c.dir === 1);
    const blueRise = crossings('sun', t0, t1, lat, lng, -6 * RAD).find(c => c.dir === 1);
    const blueSet = crossings('sun', t0, t1, lat, lng, -6 * RAD).find(c => c.dir === -1);

    // 月亮：h0 = 0.7275 * 视差 - 0.5667°
    const md = toDays((t0 + t1) / 2);
    const mc = moonCoords(md);
    const h0moon = 0.7275 * (mc.parallax * DEG) - 0.5667;
    const wide = crossings('moon', t0 - 12 * 3600e3, t1 + 12 * 3600e3, lat, lng, h0moon * RAD);
    const pickMoon = dir => {
      const inside = wide.find(c => c.dir === dir && c.t >= t0 && c.t < t1);
      if (inside) return { t: inside.t, shift: 0 };
      const after = wide.find(c => c.dir === dir && c.t >= t1);
      if (after) return { t: after.t, shift: 1 };
      const before = wide.filter(c => c.dir === dir && c.t < t0).pop();
      if (before) return { t: before.t, shift: -1 };
      return null;
    };
    const mrise = pickMoon(1);
    const mset = pickMoon(-1);

    const ph = phaseInfo((t0 + t1) / 2);

    let riseAz = null, setAz = null;
    if (rise) {
      const a = altitudeOf('sun', rise.t, lat, lng);
      // 该函数返回「南为 0、向西为正」，转成「北为 0、顺时针为正」
      riseAz = (azimuthOf(a.c.ra, a.c.dec, a.d, lat, lng) * DEG + 180) % 360;
    }
    if (set) {
      const a = altitudeOf('sun', set.t, lat, lng);
      setAz = (azimuthOf(a.c.ra, a.c.dec, a.d, lat, lng) * DEG + 180) % 360;
    }

    const res = {
      rise: rise ? rise.t : null,
      set: set ? set.t : null,
      riseAz, setAz,
      goldenAm: goldRise && goldEndRise ? [goldRise.t, goldEndRise.t] : null,
      goldenPm: goldSet ? [goldSet.t, set ? set.t : goldSet.t] : null,
      blueAm: blueRise && goldRise ? [blueRise.t, goldRise.t] : null,
      bluePm: set && blueSet ? [set.t, blueSet.t] : null,
      moonRise: mrise ? mrise.t : null,
      moonRiseShift: mrise ? mrise.shift : 0,
      moonSet: mset ? mset.t : null,
      moonSetShift: mset ? mset.shift : 0,
      moonAlwaysUp: !mrise && !mset ? altitudeOf('moon', (t0 + t1) / 2, lat, lng).alt > 0 : null,
      phase: ph
    };
    cacheAstro[key] = res;
    return res;
  }

  /* =====================================================================
   * 3. 状态
   * ===================================================================== */
  const DONE_KEY = 'travel.done.v1';
  let done = {};
  try { done = JSON.parse(localStorage.getItem(DONE_KEY) || '{}') || {}; } catch (e) { done = {}; }
  function saveDone() {
    try { localStorage.setItem(DONE_KEY, JSON.stringify(done)); } catch (e) { }
  }
  const itemKey = (day, item) => day.date + '|' + item.name;

  let mapFilter = null; // null = 全部
  let mapSelected = null; // 当前选中的点位（当天 items 的下标）
  let activeDay = 0;

  /* =====================================================================
   * 4. 通用渲染
   * ===================================================================== */
  function durationText(mins) {
    if (!mins && mins !== 0) return '';
    if (mins < 60) return mins + ' 分钟';
    const h = Math.floor(mins / 60), m = mins % 60;
    return m ? h + ' 小时 ' + m + ' 分' : h + ' 小时';
  }

  function fmtMoonTime(t, shift) {
    if (t == null) return '—';
    return (shift > 0 ? '次日' : shift < 0 ? '前日' : '') + fmtHM(t);
  }

  function astroPills(day) {
    const a = astroFor(day);
    const wrap = el('div', 'dh-astro');
    const sun = el('span', 'pill sun');
    sun.innerHTML = '<i>☀</i>' + fmtHM(a.rise) + ' → ' + fmtHM(a.set);
    const moon = el('span', 'pill moon');
    const mtxt = a.moonAlwaysUp === true ? '全天在地平线上'
      : a.moonAlwaysUp === false ? '全天不升起'
        : '升 ' + fmtMoonTime(a.moonRise, a.moonRiseShift) + ' 落 ' + fmtMoonTime(a.moonSet, a.moonSetShift);
    moon.innerHTML = '<i>☾</i>' + mtxt;
    const ph = el('span', 'pill');
    ph.innerHTML = '<i>◐</i>' + Math.round(a.phase.fraction * 100) + '% ' + phaseName(a.phase.phase);
    wrap.appendChild(sun);
    wrap.appendChild(moon);
    wrap.appendChild(ph);
    return wrap;
  }

  /* =====================================================================
   * 4.5 总览（日历卡）
   * ===================================================================== */
  const MON_EN = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

  function renderOverview() {
    const days = TRIP.days || [];
    if (!days.length) return;
    const first = days[0].date, last = days[days.length - 1].date;
    let count = 0;
    days.forEach(d => (d.items || []).forEach(it => { if (it.type !== 'divider') count++; }));

    $('#ovTitle').textContent = TRIP.title || '行程';
    $('#ovMeta').textContent = days.length + ' 天 · ' + fmtMD(first) + ' – ' + fmtMD(last) +
      (TRIP.people ? ' · ' + TRIP.people + ' 人' : '') + ' · ' + count + ' 个安排';

    const today = todayInTZ();
    let badge;
    if (today < first) badge = '距出发还有 ' + dayDiff(today, first) + ' 天';
    else if (today > last) badge = '行程已结束';
    else badge = '行程第 ' + (dayDiff(first, today) + 1) + ' 天 / 共 ' + days.length + ' 天';
    $('#ovBadge').textContent = badge;

    const box = $('#ovDays');
    box.innerHTML = '';
    days.forEach((d, di) => {
      const card = el('button', 'ov-card' + (d.date === today ? ' today' : ''));
      card.style.setProperty('--c', DAY_COLORS[di % DAY_COLORS.length]);

      const p = dateParts(d.date);
      const dateCol = el('div', 'ov-date');
      dateCol.appendChild(el('div', 'ov-day', String(p.d)));
      dateCol.appendChild(el('div', 'ov-mon', MON_EN[p.m - 1]));
      dateCol.appendChild(el('div', 'ov-wd', weekdayCN(d.date)));
      card.appendChild(dateCol);

      const body = el('div', 'ov-body');
      const row1 = el('div', 'ov-row1');
      row1.appendChild(el('span', 'ov-d', 'D' + (di + 1)));
      if (d.tag) row1.appendChild(el('span', 'ov-tag', esc(d.tag)));
      if (d.date === today) row1.appendChild(el('span', 'ov-today', '今天'));
      body.appendChild(row1);
      body.appendChild(el('div', 'ov-title', esc(d.title || '')));
      if (d.summary) body.appendChild(el('div', 'ov-sum', esc(d.summary)));
      card.appendChild(body);

      card.addEventListener('click', () => {
        switchView('plan');
        setTimeout(() => {
          const t = document.getElementById('day-' + di);
          if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 80);
      });
      box.appendChild(card);
    });
  }

  /* =====================================================================
   * 5. 行程视图
   * ===================================================================== */
  function renderTripCard() {
    const days = TRIP.days || [];
    const first = days[0] ? days[0].date : '';
    const last = days.length ? days[days.length - 1].date : '';
    const points = days.reduce((n, d) => n + (d.items ? d.items.length : 0), 0);
    let meta = days.length + ' 天';
    if (first && last) {
      meta += ' · ' + fmtMD(first) + ' – ' + fmtMD(last);
    }
    if (TRIP.people) meta += ' · ' + TRIP.people + ' 人';
    meta += ' · ' + points + ' 个点位';
    $('#tcMeta').textContent = meta;

    const today = todayInTZ();
    let txt;
    if (!first) txt = '';
    else if (today < first) txt = '距出发还有 ' + dayDiff(today, first) + ' 天';
    else if (today > last) txt = '行程已结束';
    else txt = '行程第 ' + (dayDiff(first, today) + 1) + ' 天 · ' + (days.length - dayDiff(first, today) - 1) + ' 天后结束';
    $('#tcCount').textContent = txt;
  }

  function fmtMD(dateStr) {
    const p = dateParts(dateStr);
    return p.m + '/' + p.d;
  }

  function renderDayStrip() {
    const strip = $('#daystrip');
    strip.innerHTML = '';
    const todayStr = todayInTZ();
    (TRIP.days || []).forEach((d, i) => {
      const b = el('button', 'chip' + (i === activeDay ? ' active' : ''));
      b.dataset.day = i;
      b.innerHTML = '<b>D' + (i + 1) + '</b>' + fmtMD(d.date) + (d.date === todayStr ? ' ·今' : '');
      b.addEventListener('click', () => {
        const target = document.getElementById('day-' + i);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      strip.appendChild(b);
    });
  }

  function renderDays() {
    const box = $('#days');
    box.innerHTML = '';
    const todayStr = todayInTZ();
    (TRIP.days || []).forEach((d, di) => {
      const article = el('article', 'day' + (d.date === todayStr ? ' today' : ''));
      article.id = 'day-' + di;

      const head = el('div', 'day-head');
      const row1 = el('div', 'dh-row1');
      const doneCount = (d.items || []).filter(it => done[itemKey(d, it)]).length;
      row1.innerHTML =
        '<span class="dh-dnum">D' + (di + 1) + '</span>' +
        '<span>' + fmtMD(d.date) + ' ' + weekdayCN(d.date) + '</span>' +
        (d.date === todayStr ? '<span class="dh-today">今天</span>' : '') +
        '<span class="dh-spacer"></span>' +
        (doneCount ? '<span class="dh-progress">✓ ' + doneCount + '/' + (d.items || []).length + '</span>' : '') +
        '<button class="dh-copy" data-copy="' + di + '">复制</button>';
      head.appendChild(row1);

      const h2 = el('h2', 'dh-title');
      h2.textContent = d.title || fmtMD(d.date);
      head.appendChild(h2);
      if (d.note) {
        const p = el('div', 'dh-note');
        p.textContent = d.note;
        head.appendChild(p);
      }
      head.appendChild(astroPills(d));
      article.appendChild(head);

      const ol = el('ol', 'tl');
      (d.items || []).forEach((it, ii) => {
        // 方案分隔条：把「方案 A / 方案 B」在时间轴上分开
        if (it.type === 'divider') {
          const dvd = el('li', 'tl-divider');
          dvd.appendChild(el('span', 'lbl', esc(it.name || '')));
          ol.appendChild(dvd);
          return;
        }

        const li = el('li', 'it' + (done[itemKey(d, it)] ? ' done' : ''));
        li.dataset.type = it.type || 'other';
        li.dataset.day = di;
        li.dataset.item = ii;

        const time = el('div', 'it-time');
        time.textContent = it.time || '';

        const rail = el('div', 'it-rail');
        rail.appendChild(el('span', 'it-dot'));

        const body = el('div', 'it-body');
        if (it.transit) {
          const t = el('div', 'it-transit');
          t.textContent = it.transit;
          body.appendChild(t);
        }
        const name = el('div', 'it-name');
        name.textContent = it.name || '';
        body.appendChild(name);

        const meta = el('div', 'it-meta');
        if (it.stay) meta.appendChild(el('span', 'it-tag', '停留 ' + durationText(it.stay)));
        if (it.type && TYPE_LABEL[it.type]) meta.appendChild(el('span', 'it-tag', TYPE_LABEL[it.type]));
        if (meta.children.length) body.appendChild(meta);

        if (it.note) {
          const n = el('div', 'it-note');
          n.textContent = it.note;
          body.appendChild(n);
        }

        const chk = el('button', 'it-check');
        chk.setAttribute('aria-label', '标记完成');
        chk.innerHTML = '✓';
        chk.addEventListener('click', ev => {
          ev.stopPropagation();
          const k = itemKey(d, it);
          if (done[k]) delete done[k]; else done[k] = true;
          saveDone();
          li.classList.toggle('done', !!done[k]);
          // 更新当天进度
          const c = (d.items || []).filter(x => done[itemKey(d, x)]).length;
          const prog = row1.querySelector('.dh-progress');
          if (c && prog) prog.textContent = '✓ ' + c + '/' + d.items.length;
          else if (c && !prog) {
            const sp = row1.querySelector('.dh-spacer');
            const span = el('span', 'dh-progress', '✓ ' + c + '/' + d.items.length);
            row1.insertBefore(span, sp.nextSibling);
          } else if (!c && prog) prog.remove();
        });
        li.appendChild(chk);

        li.appendChild(time);
        li.appendChild(rail);
        li.appendChild(body);

        li.addEventListener('click', () => openSheet(di, ii));
        ol.appendChild(li);
      });
      article.appendChild(ol);

      if (!(d.items || []).length) {
        article.appendChild(el('div', 'dh-note', '这天还没有安排。'));
      }
      box.appendChild(article);
    });

    // 复制按钮
    box.querySelectorAll('[data-copy]').forEach(btn => {
      btn.addEventListener('click', ev => {
        ev.stopPropagation();
        const di = +btn.dataset.copy;
        copyDay(di, btn);
      });
    });
  }

  function dayAsText(di) {
    const d = TRIP.days[di];
    const a = astroFor(d);
    const lines = [];
    lines.push('【D' + (di + 1) + ' · ' + fmtMD(d.date) + ' ' + weekdayCN(d.date) + '】' + (d.title || ''));
    lines.push('日出 ' + fmtHM(a.rise) + ' · 日落 ' + fmtHM(a.set) + ' · 月相 ' + Math.round(a.phase.fraction * 100) + '%');
    if (d.note) lines.push(d.note);
    lines.push('');
    (d.items || []).forEach(it => {
      if (it.type === 'divider') {
        lines.push('');
        lines.push('—— ' + it.name + ' ——');
        return;
      }
      let l = it.time + '  ' + it.name;
      const bits = [];
      if (it.stay) bits.push('停留 ' + durationText(it.stay));
      if (it.transit) bits.push(it.transit);
      if (bits.length) l += '（' + bits.join(' · ') + '）';
      lines.push(l);
      if (it.note) lines.push('    ' + it.note);
    });
    return lines.join('\n');
  }

  async function copyDay(di, btn) {
    const text = dayAsText(di);
    const ok = await copyText(text);
    if (ok) {
      toast('已复制 D' + (di + 1) + ' 的行程');
    } else {
      openTextSheet('复制这段文字', text);
    }
  }

  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (e) { }
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:-500px;left:0;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) {
      return false;
    }
  }

  /* =====================================================================
   * 6. 地图视图（OSM/CARTO 底图 + 拖拽缩放）
   * ===================================================================== */
  // OSM 官方瓦片：免费、无需 API Key（个人低频率使用符合其使用政策，需署名）
  const TILE_URL = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
  const mapState = {
    center: { lat: 27.6, lng: -81.2 },
    zoom: 7,
    inited: false,
    tiles: new Map(),
    points: [],
    single: false,
    binded: false
  };

  const clampZoom = z => Math.max(2, Math.min(17, z));

  // Web Mercator：经纬度 -> 世界像素坐标
  function mProj(lat, lng, z) {
    const size = 256 * Math.pow(2, z);
    const s = Math.sin(lat * Math.PI / 180);
    return {
      x: (lng + 180) / 360 * size,
      y: (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * size
    };
  }
  function mUnproj(x, y, z) {
    const size = 256 * Math.pow(2, z);
    const n = Math.PI - 2 * Math.PI * y / size;
    return {
      lat: 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n))),
      lng: x / size * 360 - 180
    };
  }

  function mDraw() {
    const canvas = $('#mapCanvas');
    if (!canvas) return;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;

    const z = mapState.zoom;
    const c = mProj(mapState.center.lat, mapState.center.lng, z);
    const ox = c.x - w / 2, oy = c.y - h / 2;

    /* ---- 底图瓦片 ---- */
    const tz = Math.max(1, Math.min(19, Math.round(z)));
    const scale = Math.pow(2, z - tz);
    const tilePx = 256 * scale;
    const n = Math.pow(2, tz);
    const retina = '';
    const layer = $('#mapTiles');
    const need = new Set();

    const x0 = Math.floor(ox / tilePx) - 1, x1 = Math.floor((ox + w) / tilePx) + 1;
    const y0 = Math.floor(oy / tilePx) - 1, y1 = Math.floor((oy + h) / tilePx) + 1;

    for (let tx = x0; tx <= x1; tx++) {
      for (let ty = y0; ty <= y1; ty++) {
        if (ty < 0 || ty >= n) continue;
        const wx = ((tx % n) + n) % n;
        const key = tz + '/' + wx + '/' + ty;
        need.add(key);
        let img = mapState.tiles.get(key);
        if (!img) {
          img = document.createElement('img');
          img.alt = '';
          img.decoding = 'async';
          img.onerror = function () { this.style.visibility = 'hidden'; };
          img.src = TILE_URL.replace('{z}', tz).replace('{x}', wx).replace('{y}', ty);
          layer.appendChild(img);
          mapState.tiles.set(key, img);
        }
        img.style.visibility = '';
        img.style.left = Math.round(tx * tilePx - ox) + 'px';
        img.style.top = Math.round(ty * tilePx - oy) + 'px';
        img.style.width = Math.round(tilePx) + 'px';
        img.style.height = Math.round(tilePx) + 'px';
      }
    }
    // 缓存别无限长：超过 120 张就把最早的扔掉
    if (mapState.tiles.size > 120) {
      let over = mapState.tiles.size - 120;
      for (const [k, v] of mapState.tiles) {
        if (over-- <= 0) break;
        v.remove();
        mapState.tiles.delete(k);
      }
    }

    /* ---- 折线 ---- */
    const svg = $('#mapOverlay');
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    const byDay = {};
    mapState.points.forEach(p => {
      (byDay[p.di] = byDay[p.di] || []).push(p);
    });
    Object.keys(byDay).forEach(di => {
      const group = byDay[di];
      if (group.length < 2) return;
      const pts = group.map(p => {
        const q = mProj(p.it.lat, p.it.lng, z);
        return (q.x - ox).toFixed(1) + ',' + (q.y - oy).toFixed(1);
      }).join(' ');
      const pl = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      pl.setAttribute('points', pts);
      pl.setAttribute('fill', 'none');
      pl.setAttribute('stroke', DAY_COLORS[di % DAY_COLORS.length]);
      pl.setAttribute('stroke-width', '2.6');
      pl.setAttribute('stroke-linecap', 'round');
      pl.setAttribute('stroke-linejoin', 'round');
      pl.setAttribute('opacity', '0.75');
      svg.appendChild(pl);
    });

    /* ---- 点位 ---- */
    const box = $('#mapMarkers');
    box.innerHTML = '';
    const single = mapState.single;

    // 同一天里坐标相同的点只画一次
    const seen = new Set();
    const markers = mapState.points.filter(p => {
      const k = p.di + '|' + p.it.lat.toFixed(5) + ',' + p.it.lng.toFixed(5);
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    });

    // 选中的点最后画，保证它在重叠时压在最上面
    const ordered = markers.slice().sort((a, b) => (a.ii === mapSelected ? 1 : 0) - (b.ii === mapSelected ? 1 : 0));
    ordered.forEach((p, idx) => {
      const q = mProj(p.it.lat, p.it.lng, z);
      const x = q.x - ox, y = q.y - oy;
      // 不做「散开」：真地图上把同一个园区的点挪开几公里是撒谎。
      // 重叠的点靠下方列表点选（或放大后自然分开）。
      if (x < -40 || x > w + 40 || y < -40 || y > h + 40) return;

      const el = document.createElement('div');
      el.className = 'mk' + (single ? '' : ' small') + (single && mapSelected === p.ii ? ' sel' : '');
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.style.background = DAY_COLORS[p.di % DAY_COLORS.length];
      if (single) el.textContent = String(p.ii + 1);
      el.title = 'D' + (p.di + 1) + ' ' + p.it.time + ' ' + p.it.name;
      el.addEventListener('click', ev => {
        ev.stopPropagation();
        // 点地图上的点：打开详情，同时把下面的列表滚到对应行
        mapSelected = p.ii;
        mDraw();
        renderMapList();
        scrollListTo(p.ii);
        openSheet(p.di, p.ii);
      });
      box.appendChild(el);
    });

    if (!markers.length) {
      const msg = document.createElement('div');
      msg.className = 'mapempty';
      msg.textContent = '这一天没有带坐标的点位';
      box.appendChild(msg);
    }
  }

  function mFit(points) {
    const canvas = $('#mapCanvas');
    if (!canvas || !points.length) return;
    const w = canvas.clientWidth || 340, h = canvas.clientHeight || 400;
    const lats = points.map(p => p.it.lat), lngs = points.map(p => p.it.lng);
    const minLat = Math.min.apply(null, lats), maxLat = Math.max.apply(null, lats);
    const minLng = Math.min.apply(null, lngs), maxLng = Math.max.apply(null, lngs);
    mapState.center = { lat: (minLat + maxLat) / 2, lng: (minLng + maxLng) / 2 };
    let z = 17;
    for (; z > 2; z -= 0.25) {
      const a = mProj(maxLat, minLng, z), b = mProj(minLat, maxLng, z);
      if (Math.abs(b.x - a.x) < w - 60 && Math.abs(b.y - a.y) < h - 60) break;
    }
    mapState.zoom = clampZoom(z);
  }

  function mZoomBy(delta, anchorX, anchorY) {
    const canvas = $('#mapCanvas');
    if (!canvas) return;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    const ax = anchorX == null ? w / 2 : anchorX;
    const ay = anchorY == null ? h / 2 : anchorY;
    const nz = clampZoom(mapState.zoom + delta);
    if (nz === mapState.zoom) return;
    const c0 = mProj(mapState.center.lat, mapState.center.lng, mapState.zoom);
    const wx = c0.x - w / 2 + ax, wy = c0.y - h / 2 + ay;
    const s = Math.pow(2, nz - mapState.zoom);
    const c1 = mUnproj(wx * s + w / 2 - ax, wy * s + h / 2 - ay, nz);
    mapState.center = c1;
    mapState.zoom = nz;
    mDraw();
  }

  function mBind() {
    const canvas = $('#mapCanvas');
    if (!canvas || mapState.binded) return;
    mapState.binded = true;

    let pointers = new Map();
    let drag = null;
    let pinch = null;

    canvas.addEventListener('pointerdown', e => {
      if (e.target.closest && e.target.closest('.mapctl')) return;
      try { canvas.setPointerCapture(e.pointerId); } catch (_) { }
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 1) {
        drag = { x: e.clientX, y: e.clientY, center: { lat: mapState.center.lat, lng: mapState.center.lng } };
        pinch = null;
      } else if (pointers.size === 2) {
        const v = [...pointers.values()];
        pinch = {
          dist: Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y) || 1,
          zoom: mapState.zoom,
          mx: (v[0].x + v[1].x) / 2,
          my: (v[0].y + v[1].y) / 2
        };
        drag = null;
      }
    });

    canvas.addEventListener('pointermove', e => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointers.size === 1 && drag) {
        const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
        const c = mProj(drag.center.lat, drag.center.lng, mapState.zoom);
        mapState.center = mUnproj(c.x - dx, c.y - dy, mapState.zoom);
        mDraw();
        e.preventDefault();
      } else if (pointers.size === 2 && pinch) {
        const v = [...pointers.values()];
        const dist = Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y) || 1;
        const rect = canvas.getBoundingClientRect();
        const ax = pinch.mx - rect.left, ay = pinch.my - rect.top;
        const nz = clampZoom(pinch.zoom + Math.log2(dist / pinch.dist));
        const w = canvas.clientWidth, h = canvas.clientHeight;
        const c0 = mProj(mapState.center.lat, mapState.center.lng, mapState.zoom);
        const wx = c0.x - w / 2 + ax, wy = c0.y - h / 2 + ay;
        const s = Math.pow(2, nz - mapState.zoom);
        mapState.center = mUnproj(wx * s + w / 2 - ax, wy * s + h / 2 - ay, nz);
        mapState.zoom = nz;
        mDraw();
        e.preventDefault();
      }
    });

    const endPointer = e => {
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinch = null;
      if (pointers.size === 1) {
        const v = [...pointers.values()][0];
        drag = { x: v.x, y: v.y, center: { lat: mapState.center.lat, lng: mapState.center.lng } };
      }
      if (pointers.size === 0) drag = null;
    };
    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);

    // 桌面滚轮
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      mZoomBy(e.deltaY < 0 ? 0.5 : -0.5, e.clientX - rect.left, e.clientY - rect.top);
    }, { passive: false });

    // 双击放大
    canvas.addEventListener('dblclick', e => {
      const rect = canvas.getBoundingClientRect();
      mZoomBy(1, e.clientX - rect.left, e.clientY - rect.top);
    });

    window.addEventListener('resize', () => {
      if (currentView === 'map') mDraw();
    });
  }

  function renderMap() {
    const chips = $('#mapchips');
    chips.innerHTML = '';

    const addChip = (label, color, active, onClick) => {
      const c = el('button', 'mchip' + (active ? ' on' : ''));
      if (color) {
        const dot = el('span', 'dot');
        dot.style.background = color;
        c.appendChild(dot);
      }
      c.appendChild(document.createTextNode(label));
      c.addEventListener('click', onClick);
      chips.appendChild(c);
    };
    addChip('全部', null, mapFilter === null, () => { mapFilter = null; mapSelected = null; renderMap(); });
    TRIP.days.forEach((d, di) => {
      addChip('D' + (di + 1) + ' ' + fmtMD(d.date), DAY_COLORS[di % DAY_COLORS.length], mapFilter === di,
        () => { mapFilter = (mapFilter === di ? null : di); mapSelected = null; renderMap(); });
    });

    const pts = [];
    TRIP.days.forEach((d, di) => {
      if (mapFilter !== null && mapFilter !== di) return;
      (d.items || []).forEach((it, ii) => {
        if (typeof it.lat === 'number' && typeof it.lng === 'number' && isFinite(it.lat) && isFinite(it.lng)) {
          pts.push({ d, di, it, ii });
        }
      });
    });

    mapState.points = pts;
    mapState.single = mapFilter !== null;

    const canvasOk = $('#mapCanvas') && $('#mapCanvas').clientWidth > 0;
    if (!mapState.inited && canvasOk) {
      mapState.inited = true;
      const home = TRIP.mapHome;
      if (home) {
        mapState.center = { lat: home.lat, lng: home.lng };
        mapState.zoom = clampZoom(home.zoom || 7);
      } else if (pts.length) {
        mFit(pts);
      }
    } else if (mapFilter !== null && pts.length) {
      mFit(pts);
    } else if (mapFilter === null && TRIP.mapHome) {
      mapState.center = { lat: TRIP.mapHome.lat, lng: TRIP.mapHome.lng };
      mapState.zoom = clampZoom(TRIP.mapHome.zoom || 7);
    }

    mBind();
    mDraw();

    const markerCount = pts.length;
    $('#mapcount').textContent = mapFilter === null
      ? markerCount + ' 个点位 · 点某一天看当天路线'
      : 'D' + (mapFilter + 1) + ' · ' + markerCount + ' 个点位，数字是当天顺序';

    if (mapFilter !== null) {
      const chip = chips.querySelectorAll('.mchip')[mapFilter + 1];
      if (chip && chip.scrollIntoView) chip.scrollIntoView({ block: 'nearest', inline: 'center' });
    }

    const linkEl = $('#mapall');
    if (mapFilter !== null && pts.length >= 2) {
      const origin = pts[0].it.lat + ',' + pts[0].it.lng;
      const dest = pts[pts.length - 1].it.lat + ',' + pts[pts.length - 1].it.lng;
      const mids = pts.slice(1, -1).map(p => p.it.lat + ',' + p.it.lng).slice(0, 9);
      let url = 'https://www.google.com/maps/dir/?api=1&origin=' + encodeURIComponent(origin) +
        '&destination=' + encodeURIComponent(dest) + '&travelmode=transit';
      if (mids.length) url += '&waypoints=' + encodeURIComponent(mids.join('|'));
      linkEl.href = url;
      linkEl.textContent = '用 Google 地图导航当天路线 →';
      linkEl.style.display = '';
    } else {
      linkEl.style.display = 'none';
    }

    renderMapList();
  }

  /* ---------- 地图下方的当天行程 ---------- */
  function renderMapList() {
    const box = $('#mapList');
    if (!box) return;
    box.innerHTML = '';

    if (mapFilter === null) {
      // 全部模式：列每天一行，点一下就切到那天
      const hint = el('div', 'ml-hint', '点上面某一天，这里显示当天的安排');
      box.appendChild(hint);
      TRIP.days.forEach((d, di) => {
        const cnt = (d.items || []).filter(it => typeof it.lat === 'number' && isFinite(it.lat)).length;
        const row = el('div', 'ml-dayrow');
        const badge = el('span', 'badge', 'D' + (di + 1));
        badge.style.background = DAY_COLORS[di % DAY_COLORS.length];
        row.appendChild(badge);
        const t = el('span', 'title', esc(d.title || ''));
        row.appendChild(t);
        row.appendChild(el('span', 'cnt', cnt + ' 点'));
        row.addEventListener('click', () => { mapFilter = di; mapSelected = null; renderMap(); });
        box.appendChild(row);
      });
      return;
    }

    const d = TRIP.days[mapFilter];
    const head = el('div', 'ml-head',
      'D' + (mapFilter + 1) + ' · ' + fmtMD(d.date) + ' ' + weekdayCN(d.date) + ' · ' + esc(d.title || ''));
    box.appendChild(head);

    (d.items || []).forEach((it, ii) => {
      if (it.type === 'divider') {
        box.appendChild(el('div', 'ml-div', esc(it.name || '')));
        return;
      }
      const sel = mapSelected === ii;
      const row = el('div', 'ml-row' + (sel ? ' sel' : ''));
      row.dataset.ii = ii;
      row.appendChild(el('span', 'ml-time', esc(it.time || '')));
      const dot = el('span', 'ml-dot');
      dot.style.background = DAY_COLORS[mapFilter % DAY_COLORS.length];
      row.appendChild(dot);
      row.appendChild(el('span', 'ml-name', esc(it.name || '')));
      row.appendChild(el('span', 'ml-meta', it.stay ? it.stay + '′' : ''));

      if (sel) {
        const exp = el('div', 'ml-exp');
        if (it.note) exp.appendChild(el('div', 'ml-note', esc(it.note)));
        const more = el('button', 'ml-more', '查看详情 ›');
        more.addEventListener('click', ev => {
          ev.stopPropagation();
          openSheet(mapFilter, ii);
        });
        exp.appendChild(more);
        row.appendChild(exp);
      }

      row.addEventListener('click', () => selectMapItem(ii));
      box.appendChild(row);
    });
  }

  // 点一行：地图飞过去 + 高亮 + 展开这一行
  function selectMapItem(ii) {
    mapSelected = (mapSelected === ii ? null : ii);
    const p = (mapState.points || []).find(x => x.ii === ii);
    if (p && mapSelected === ii) {
      mapState.center = { lat: p.it.lat, lng: p.it.lng };
      if (mapState.zoom < 12) mapState.zoom = 14;
    }
    mDraw();
    renderMapList();
    if (mapSelected === ii) scrollListTo(ii);
  }

  function scrollListTo(ii) {
    const box = $('#mapList');
    if (!box) return;
    const row = box.querySelector('.ml-row[data-ii="' + ii + '"]');
    if (row && row.scrollIntoView) row.scrollIntoView({ block: 'nearest' });
  }

  /* =====================================================================
   * 6.5 分类汇总（洲际交通 / 当地交通 / 景点）
   * ===================================================================== */
  const GUIDES = window.TRIP_GUIDES || { flights: [], ground: [], sights: [] };
  const GUIDE_TABS = [
    { key: 'flights', label: '洲际交通' },
    { key: 'ground', label: '当地交通' },
    { key: 'sights', label: '景点' },
    { key: 'food', label: '美食' },
    { key: 'hotels', label: '酒店' }
  ];
  let guideTab = 'flights';

  const slotClass = s => /早/.test(s) ? 's-b' : /午/.test(s) ? 's-l' : /晚/.test(s) ? 's-d' : 's-n';

  const modeClass = m => /自驾/.test(m) ? 'drive'
    : /打车|出租|Uber/i.test(m) ? 'taxi'
      : /步行/.test(m) ? 'walk' : 'transit';


  /* ---------- 距离：自驾/打车走 OSRM 实际路线，其余算直线 ---------- */
  const routeCache = {};

  const haversineKm = (a, b) => {
    const R = 6371, d2r = Math.PI / 180;
    const dLat = (b.lat - a.lat) * d2r, dLng = (b.lng - a.lng) * d2r;
    const h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(a.lat * d2r) * Math.cos(b.lat * d2r) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  };

  const fmtKm = km => km < 10 ? km.toFixed(1) + ' km' : Math.round(km) + ' km';
  const fmtMin = min => {
    if (min < 60) return min + ' 分钟';
    const h = Math.floor(min / 60), m = min % 60;
    return m ? h + ' 小时 ' + m + ' 分' : h + ' 小时';
  };

  async function driveRoute(a, b) {
    const key = [a.lat.toFixed(4), a.lng.toFixed(4), b.lat.toFixed(4), b.lng.toFixed(4)].join('|');
    if (routeCache[key]) return routeCache[key];
    try {
      const url = 'https://router.project-osrm.org/route/v1/driving/' +
        a.lng + ',' + a.lat + ';' + b.lng + ',' + b.lat + '?overview=full&geometries=geojson&alternatives=false';
      const res = await fetch(url);
      if (!res.ok) return null;
      const j = await res.json();
      if (j.code !== 'Ok' || !j.routes || !j.routes.length) return null;
      const rt = j.routes[0];
      const r = { km: rt.distance / 1000, min: Math.round(rt.duration / 60), geo: rt.geometry && rt.geometry.coordinates };
      routeCache[key] = r;
      return r;
    } catch (e) { return null; }
  }

  function refreshGuideDistances() {
    const G = GUIDES.ground || [];
    G.forEach((g, gi) => {
      if (!g.from || !g.to) return;
      const line = haversineKm(g.from, g.to);
      const pending = [];
      (g.options || []).forEach((o, oi) => {
        const cell = document.querySelector('.gd-dist[data-gi="' + gi + '"][data-oi="' + oi + '"]');
        if (!cell) return;
        cell.textContent = '直线 ' + fmtKm(line);
        if (/自驾|打车|出租|Uber/i.test(o.mode || '')) pending.push(cell);
      });
      if (!pending.length) return;
      driveRoute(g.from, g.to).then(r => {
        if (r && r.geo) { g._geo = r.geo; }
        if (r && r.geo && g._snap) {
          drawStaticMap(g._snap, g._mid, g._zoom, {
            geo: r.geo,
            markers: [
              { lat: g.from.lat, lng: g.from.lng, color: '#0f766e' },
              { lat: g.to.lat, lng: g.to.lng, color: '#c2410c' }
            ],
            cap: (g.from.label || '') + ' → ' + (g.to.label || '') + '（实际路线）'
          });
        }
        pending.forEach(cell => {
          cell.textContent = r
            ? '实际路线 ' + fmtKm(r.km)
            : '直线 ' + fmtKm(line);
        });
      });
    });
  }


  /* ---------- 静态地图快照（不可拖拽，只用于说明） ---------- */
  /* ---------- 快照懒加载：进入视口才请求瓦片 ---------- */
  const snapIO = ('IntersectionObserver' in window) ? new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      const fn = e.target.__draw;
      if (fn) { try { fn(); } catch (err) { } }
      e.target.__draw = null;
      snapIO.unobserve(e.target);
    });
  }, { rootMargin: '300px 0px' }) : null;

  function lazyDraw(box, fn) {
    box.__draw = fn;
    if (snapIO) snapIO.observe(box);
    else fn();          // 老浏览器直接画
  }

  const TILE_SRC = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';

  function fitZoomBox(a, b, w, h, pad) {
    let z = 16;
    for (; z > 3; z -= 0.25) {
      const p1 = mProj(a.lat, a.lng, z), p2 = mProj(b.lat, b.lng, z);
      if (Math.abs(p2.x - p1.x) < w - pad && Math.abs(p2.y - p1.y) < h - pad) break;
    }
    return z;
  }

  function drawStaticMap(box, center, zoom, opts) {
    const o = opts || {};
    const w = box.clientWidth || 340;
    const h = box.clientHeight || 140;
    if (!w || !h) return;

    while (box.firstChild) box.removeChild(box.firstChild);

    const c = mProj(center.lat, center.lng, zoom);
    const ox = c.x - w / 2, oy = c.y - h / 2;
    const tz = Math.max(1, Math.min(19, Math.round(zoom)));
    const scale = Math.pow(2, zoom - tz);
    const tilePx = 256 * scale;
    const n = Math.pow(2, tz);
    const x0 = Math.floor(ox / tilePx) - 1, x1 = Math.floor((ox + w) / tilePx) + 1;
    const y0 = Math.floor(oy / tilePx) - 1, y1 = Math.floor((oy + h) / tilePx) + 1;

    for (let tx = x0; tx <= x1; tx++) {
      for (let ty = y0; ty <= y1; ty++) {
        if (ty < 0 || ty >= n) continue;
        const wx = ((tx % n) + n) % n;
        const img = document.createElement('img');
        img.alt = '';
        img.src = TILE_SRC.replace('{z}', tz).replace('{x}', wx).replace('{y}', ty);
        img.style.cssText = 'position:absolute;pointer-events:none;' +
          'left:' + Math.round(tx * tilePx - ox) + 'px;top:' + Math.round(ty * tilePx - oy) + 'px;' +
          'width:' + Math.round(tilePx) + 'px;height:' + Math.round(tilePx) + 'px;';
        box.appendChild(img);
      }
    }

    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none';

    const toXY = p => {
      const q = mProj(p.lat, p.lng, zoom);
      return { x: q.x - ox, y: q.y - oy };
    };

    // 路线
    if (o.geo && o.geo.length > 1) {
      const pl = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      pl.setAttribute('points', o.geo.map(pt => {
        const q = mProj(pt[1], pt[0], zoom);
        return (q.x - ox).toFixed(1) + ',' + (q.y - oy).toFixed(1);
      }).join(' '));
      pl.setAttribute('fill', 'none');
      pl.setAttribute('stroke', '#0f766e');
      pl.setAttribute('stroke-width', '3');
      pl.setAttribute('stroke-linecap', 'round');
      pl.setAttribute('opacity', '0.9');
      svg.appendChild(pl);
    } else if (o.from && o.to) {
      const a = toXY(o.from), b = toXY(o.to);
      const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      ln.setAttribute('x1', a.x); ln.setAttribute('y1', a.y);
      ln.setAttribute('x2', b.x); ln.setAttribute('y2', b.y);
      ln.setAttribute('stroke', '#0f766e');
      ln.setAttribute('stroke-width', '2.5');
      ln.setAttribute('stroke-dasharray', '6 5');
      ln.setAttribute('opacity', '0.85');
      svg.appendChild(ln);
    }

    // 点
    (o.markers || []).forEach(m => {
      const p = toXY(m);
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', p.x); circle.setAttribute('cy', p.y);
      circle.setAttribute('r', m.big ? 6 : 5);
      circle.setAttribute('fill', m.color || '#0f766e');

  /* ---------- 全屏地图（点快照打开，可拖拽缩放） ---------- */
  const mm = { center: { lat: 0, lng: 0 }, zoom: 12, from: null, to: null, geo: null, spot: null, binded: false };

  function openMapModal(g, center, zoom, spot) {
    // 先让弹层显示，否则量不到尺寸
    const el = $('#mapModal');
    el.classList.add('show');
    document.body.style.overflow = 'hidden';

    mm.center = { lat: center.lat, lng: center.lng };
    mm.zoom = zoom;
    mm.from = (g && g.from) || null;
    mm.to = (g && g.to) || null;
    mm.geo = (g && g._geo) || null;
    mm.spot = spot || null;

    // 全屏窗口比快照大得多，按实际尺寸重新算缩放
    const box = el.querySelector('.mm-canvas');
    const w = box ? box.clientWidth : 0, h = box ? box.clientHeight : 0;
    if (w && h) {
      if (mm.from && mm.to) {
        mm.zoom = fitZoomBox(mm.from, mm.to, w, h, 120);
        mm.center = { lat: (mm.from.lat + mm.to.lat) / 2, lng: (mm.from.lng + mm.to.lng) / 2 };
      } else if (mm.spot) {
        mm.zoom = Math.max(zoom, 15);
      }
    }

    mmBind();
    mmDraw();
  }
  function closeMapModal() {
    $('#mapModal').classList.remove('show');
    document.body.style.overflow = '';
  }

  function mmDraw() {
    const box = $('#mmCanvas');
    if (!box) return;
    const w = box.clientWidth, h = box.clientHeight;
    if (!w || !h) return;

    const z = mm.zoom;
    const c = mProj(mm.center.lat, mm.center.lng, z);
    const ox = c.x - w / 2, oy = c.y - h / 2;

    const layer = $('#mmTiles');
    layer.innerHTML = '';
    const tz = Math.max(1, Math.min(19, Math.round(z)));
    const scale = Math.pow(2, z - tz);
    const tilePx = 256 * scale;
    const n = Math.pow(2, tz);
    const x0 = Math.floor(ox / tilePx) - 1, x1 = Math.floor((ox + w) / tilePx) + 1;
    const y0 = Math.floor(oy / tilePx) - 1, y1 = Math.floor((oy + h) / tilePx) + 1;

    for (let tx = x0; tx <= x1; tx++) {
      for (let ty = y0; ty <= y1; ty++) {
        if (ty < 0 || ty >= n) continue;
        const wx = ((tx % n) + n) % n;
        const img = document.createElement('img');
        img.alt = '';
        img.src = TILE_SRC.replace('{z}', tz).replace('{x}', wx).replace('{y}', ty);
        img.style.cssText = 'position:absolute;pointer-events:none;' +
          'left:' + Math.round(tx * tilePx - ox) + 'px;top:' + Math.round(ty * tilePx - oy) + 'px;' +
          'width:' + Math.round(tilePx) + 'px;height:' + Math.round(tilePx) + 'px;';
        layer.appendChild(img);
      }
    }

    const svg = $('#mmSvg');
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    const xy = p => { const q = mProj(p.lat, p.lng, z); return { x: q.x - ox, y: q.y - oy }; };

    if (mm.geo && mm.geo.length > 1) {
      const pl = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      pl.setAttribute('points', mm.geo.map(pt => {
        const q = mProj(pt[1], pt[0], z);
        return (q.x - ox).toFixed(1) + ',' + (q.y - oy).toFixed(1);
      }).join(' '));
      pl.setAttribute('fill', 'none');
      pl.setAttribute('stroke', '#0f766e');
      pl.setAttribute('stroke-width', '4');
      pl.setAttribute('opacity', '0.9');
      pl.setAttribute('stroke-linecap', 'round');
      svg.appendChild(pl);
    } else if (mm.from && mm.to) {
      const a = xy(mm.from), b = xy(mm.to);
      const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      ln.setAttribute('x1', a.x); ln.setAttribute('y1', a.y);
      ln.setAttribute('x2', b.x); ln.setAttribute('y2', b.y);
      ln.setAttribute('stroke', '#0f766e');
      ln.setAttribute('stroke-width', '3');
      ln.setAttribute('stroke-dasharray', '8 6');
      svg.appendChild(ln);
    }

    const marks = $('#mmMarks');
    marks.innerHTML = '';
    const dots = [];
    if (mm.from) dots.push({ p: mm.from, color: '#0f766e', label: mm.from.label || '起点' });
    if (mm.to) dots.push({ p: mm.to, color: '#c2410c', label: mm.to.label || '终点' });
    if (mm.spot) dots.push({ p: { lat: mm.spot.lat, lng: mm.spot.lng }, color: '#0f766e', label: mm.spot.label || '' });
    dots.forEach(d => {
      const q = xy(d.p);
      const dot = document.createElement('div');
      dot.className = 'mm-dot';
      dot.style.cssText = 'left:' + q.x + 'px;top:' + q.y + 'px;background:' + d.color;
      dot.title = d.label;
      marks.appendChild(dot);
    });

    const cap = $('#mmCap');
    if (cap) {
      cap.textContent = mm.spot ? (mm.spot.label || '')
        : (mm.from ? (mm.from.label + ' → ' + mm.to.label) : '');
    }
  }

  function mmBind() {
    const box = $('#mmCanvas');
    if (!box || mm.binded) return;
    mm.binded = true;

    let pointers = new Map(), drag = null, pinch = null;

    box.addEventListener('pointerdown', e => {
      try { box.setPointerCapture(e.pointerId); } catch (_) { }
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 1) {
        drag = { x: e.clientX, y: e.clientY, center: { lat: mm.center.lat, lng: mm.center.lng } };
        pinch = null;
      } else if (pointers.size === 2) {
        const v = [...pointers.values()];
        pinch = { dist: Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y) || 1, zoom: mm.zoom, mx: (v[0].x + v[1].x) / 2, my: (v[0].y + v[1].y) / 2 };
        drag = null;
      }
    });

    box.addEventListener('pointermove', e => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 1 && drag) {
        const c = mProj(drag.center.lat, drag.center.lng, mm.zoom);
        mm.center = mUnproj(c.x - (e.clientX - drag.x), c.y - (e.clientY - drag.y), mm.zoom);
        mmDraw();
        e.preventDefault();
      } else if (pointers.size === 2 && pinch) {
        const v = [...pointers.values()];
        const dist = Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y) || 1;
        const rect = box.getBoundingClientRect();
        const ax = pinch.mx - rect.left, ay = pinch.my - rect.top;
        const nz = clampZoom(pinch.zoom + Math.log2(dist / pinch.dist));
        const w = box.clientWidth, h = box.clientHeight;
        const c0 = mProj(mm.center.lat, mm.center.lng, mm.zoom);
        const wx = c0.x - w / 2 + ax, wy = c0.y - h / 2 + ay;
        const sc = Math.pow(2, nz - mm.zoom);
        mm.center = mUnproj(wx * sc + w / 2 - ax, wy * sc + h / 2 - ay, nz);
        mm.zoom = nz;
        mmDraw();
        e.preventDefault();
      }
    });

    const end = e => {
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinch = null;
      if (pointers.size === 1) {
        const v = [...pointers.values()][0];
        drag = { x: v.x, y: v.y, center: { lat: mm.center.lat, lng: mm.center.lng } };
      }
      if (!pointers.size) drag = null;
    };
    box.addEventListener('pointerup', end);
    box.addEventListener('pointercancel', end);

    box.addEventListener('wheel', e => {
      e.preventDefault();
      mm.zoom = clampZoom(mm.zoom + (e.deltaY < 0 ? 0.6 : -0.6));
      mmDraw();
    }, { passive: false });

    box.addEventListener('dblclick', () => { mm.zoom = clampZoom(mm.zoom + 1); mmDraw(); });

    $('#mmZoomIn').addEventListener('click', () => { mm.zoom = clampZoom(mm.zoom + 1); mmDraw(); });
    $('#mmZoomOut').addEventListener('click', () => { mm.zoom = clampZoom(mm.zoom - 1); mmDraw(); });
    $('#mmClose').addEventListener('click', closeMapModal);
    $('#mmBackdrop').addEventListener('click', closeMapModal);
    window.addEventListener('resize', () => { if ($('#mapModal').classList.contains('show')) mmDraw(); });
  }
