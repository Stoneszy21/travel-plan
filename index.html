    71: ['🌨', '小雪'], 73: ['🌨', '中雪'], 75: ['❄️', '大雪'], 77: ['🌨', '霰'],
    80: ['🌦', '阵雨'], 81: ['🌧', '阵雨'], 82: ['⛈', '强阵雨'],
    85: ['🌨', '阵雪'], 86: ['🌨', '强阵雪'],
    95: ['⛈', '雷雨'], 96: ['⛈', '雷雨冰雹'], 99: ['⛈', '强雷雨冰雹']
  };
  const wxInfo = code => WX_CODES[code] || ['🌡', '—'];

  const shiftDate = (dateStr, days) => {
    const [y, m, d] = dateStr.split('-').map(Number);
    const t = Date.UTC(y, m - 1, d) + days * 86400000;
    const dt = new Date(t);
    return dt.getUTCFullYear() + '-' + pad2(dt.getUTCMonth() + 1) + '-' + pad2(dt.getUTCDate());
  };
  const shiftYear = (dateStr, years) => {
    const [y, m, d] = dateStr.split('-').map(Number);
    return (y + years) + '-' + pad2(m) + '-' + pad2(d);
  };

  function weatherAnchors() {
    const map = new Map();
    (TRIP.days || []).forEach(d => {
      const k = d.base.lat.toFixed(2) + ',' + d.base.lng.toFixed(2);
      if (!map.has(k)) map.set(k, { lat: +d.base.lat.toFixed(2), lng: +d.base.lng.toFixed(2) });
    });
    return [...map.values()];
  }

  async function fetchWx(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  function absorb(job, anchors, byDate, pick) {
    const arr = Array.isArray(job) ? job : [job];
    arr.forEach((loc, i) => {
      const a = anchors[i];
      if (!a || !loc || !loc.daily || !loc.daily.time) return;
      const d = loc.daily;
      d.time.forEach((dt, j) => {
        const rec = pick(d, j);
        if (rec) byDate[dt] = rec;
      });
    });
  }

  async function loadWeather() {
    if (wxState.loading) return;
    wxState.loading = true;

    try {
      const raw = localStorage.getItem(WX_KEY);
      if (raw) {
        const o = JSON.parse(raw);
        if (o && o.at && Date.now() - o.at < WX_TTL && o.byDate) {
          wxState.data = o.byDate;
          wxState.loading = false;
          refreshWeatherUI();
          return;
        }
      }
    } catch (e) { }

    const days = TRIP.days || [];
    if (!days.length) { wxState.loading = false; return; }

    const anchors = weatherAnchors();
    const lat = anchors.map(a => a.lat).join(',');
    const lon = anchors.map(a => a.lng).join(',');
    const tz = TRIP.timezone || 'auto';
    const byDate = {};
    const today = todayInTZ();
    const horizon = shiftDate(today, 14);
    const first = days[0].date, last = days[days.length - 1].date;
    const from = first > today ? first : today;
    const to = last < horizon ? last : horizon;

    if (from <= to) {
      const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +
        '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
        '&timezone=' + encodeURIComponent(tz) + '&start_date=' + from + '&end_date=' + to;
      try {
        absorb(await fetchWx(url), anchors, byDate, (d, j) => ({
          tmax: d.temperature_2m_max[j],
          tmin: d.temperature_2m_min[j],
          pop: d.precipitation_probability_max ? d.precipitation_probability_max[j] : null,
          code: d.weather_code[j],
          src: 'forecast'
        }));
      } catch (e) { }
    }

    // 预报窗口之外的日期：用去年同期的实测值做参考
    const missing = days.map(d => d.date).filter(dt => !byDate[dt]);
    if (missing.length) {
      const a0 = shiftYear(missing[0], -1);
      const a1 = shiftYear(missing[missing.length - 1], -1);
      const url = 'https://archive-api.open-meteo.com/v1/archive?latitude=' + lat + '&longitude=' + lon +
        '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum' +
        '&timezone=' + encodeURIComponent(tz) + '&start_date=' + a0 + '&end_date=' + a1;
      try {
        const tmp = {};
        absorb(await fetchWx(url), anchors, tmp, (d, j) => ({
          tmax: d.temperature_2m_max[j],
          tmin: d.temperature_2m_min[j],
          pop: d.precipitation_sum ? Math.min(100, Math.round((d.precipitation_sum[j] || 0) * 100)) : null,
          code: d.weather_code[j],
          src: 'lastyear'
        }));
        // 2025-11-13 → 2026-11-13
        Object.keys(tmp).forEach(k => {
          const target = shiftYear(k, 1);
          if (!byDate[target]) byDate[target] = tmp[k];
        });
      } catch (e) { }
    }

    if (!Object.keys(byDate).length) {
      wxState.failed = true;
      wxState.loading = false;
      refreshWeatherUI();
      return;
    }

    wxState.data = byDate;
    wxState.loading = false;
    try { localStorage.setItem(WX_KEY, JSON.stringify({ at: Date.now(), byDate })); } catch (e) { }
    refreshWeatherUI();
  }

  function paintWx(row, date) {
    const v = row.querySelector('.v');
    if (!v) return;
    v.innerHTML = '';
    const w = wxState.data && wxState.data[date];
    if (!w || w.tmax == null) {
      v.className = 'v dim';
      v.textContent = wxState.failed ? '天气暂不可用' : '加载中…';
      return;
    }
    v.className = 'v';
    const info = wxInfo(w.code);
    const wrap = el('div', 'wx-row');
    const icon = el('span', 'wx-icon', info[0]);
    wrap.appendChild(icon);
    const temp = el('span', 'wx-temp', Math.round(w.tmax) + '° / ' + Math.round(w.tmin) + '°');
    wrap.appendChild(temp);
    wrap.appendChild(el('span', '', info[1]));
    if (w.pop != null) wrap.appendChild(el('span', 'wx-src', '降雨 ' + Math.round(w.pop) + '%'));
    wrap.appendChild(el('span', 'wx-src', w.src === 'forecast' ? '预报' : '去年同期'));
    v.appendChild(wrap);
  }

  function refreshWeatherUI() {
    document.querySelectorAll('[data-wx]').forEach(row => paintWx(row, row.dataset.wx));
  }

  /* =====================================================================
   * 7. 天文视图
   * ===================================================================== */
  function renderSky() {
    const box = $('#sky-list');
    box.innerHTML = '';
    (TRIP.days || []).forEach((d, di) => {
      const a = astroFor(d);
      const card = el('div', 'skyday');
      const head = el('div', 'skyhead');
      head.innerHTML =
        '<div class="sh-line"><span class="sd">D' + (di + 1) + '</span>' +
        '<span class="sd-date">' + fmtMD(d.date) + ' ' + weekdayCN(d.date) + '</span>' +
        '<span class="sa">' + esc(d.area || '') + '</span></div>' +
        '<div class="st">' + esc(d.title || '') + '</div>';
      card.appendChild(head);

      const rows = el('div', 'skyrows');
      // 天气行（异步填充）
      const wxRow = el('div', 'srow');
      wxRow.dataset.wx = d.date;
      wxRow.appendChild(el('div', 'k', '天气'));
      wxRow.appendChild(el('div', 'v dim', '加载中…'));
      rows.appendChild(wxRow);

      const row = (k, v, cls, az) => {
        const r = el('div', 'srow');
        r.appendChild(el('div', 'k', k));
        const vv = el('div', 'v' + (cls ? ' ' + cls : ''));
        vv.textContent = v;
        if (az != null) {
          const s = el('span', 'az');
          s.textContent = az;
          vv.appendChild(s);
        }
        r.appendChild(vv);
        rows.appendChild(r);
      };

      row('日出 · 日落', fmtHM(a.rise) + ' · ' + fmtHM(a.set), 'hi',
        a.rise ? '日出方位 ' + Math.round(a.riseAz) + '°' : null);
      row('白昼时长', a.rise && a.set ? durationText(Math.round((a.set - a.rise) / MIN_MS)) : '—', 'dim');
      row('黄金时刻（早）', a.goldenAm ? fmtHM(a.goldenAm[0]) + ' – ' + fmtHM(a.goldenAm[1]) : '—', 'dim');
      row('黄金时刻（晚）', a.goldenPm ? fmtHM(a.goldenPm[0]) + ' – ' + fmtHM(a.goldenPm[1]) : '—', 'dim');
      row('蓝调时刻（早）', a.blueAm ? fmtHM(a.blueAm[0]) + ' – ' + fmtHM(a.blueAm[1]) : '—', 'dim');
      row('蓝调时刻（晚）', a.bluePm ? fmtHM(a.bluePm[0]) + ' – ' + fmtHM(a.bluePm[1]) : '—', 'dim');
      row('月升 · 月落',
        a.moonAlwaysUp === true ? '全天在地平线上'
          : a.moonAlwaysUp === false ? '全天不升起'
            : fmtMoonTime(a.moonRise, a.moonRiseShift) + ' · ' + fmtMoonTime(a.moonSet, a.moonSetShift), 'mo');
      row('月相', Math.round(a.phase.fraction * 100) + '% · ' + phaseName(a.phase.phase),
        'mo', '月龄 ' + a.phase.age.toFixed(1) + ' 天');

      card.appendChild(rows);
      box.appendChild(card);
    });
  }

  /* =====================================================================
   * 8. 弹层
   * ===================================================================== */
  const backdrop = $('#backdrop');
  const sheet = $('#sheet');

  function closeSheet() {
    sheet.classList.remove('show');
    backdrop.classList.remove('show');
  }
  backdrop.addEventListener('click', closeSheet);
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    const m = document.getElementById('mapModal');
    if (m && m.classList.contains('show')) { m.classList.remove('show'); document.body.style.overflow = ''; return; }
    closeSheet();
  });

  function openSheet(di, ii) {
    const d = TRIP.days[di];
    const it = d.items[ii];
    if (!it) return;
    const hasCoord = typeof it.lat === 'number' && isFinite(it.lat);
    const name = esc(it.name);
    const gq = hasCoord ? encodeURIComponent(it.lat + ',' + it.lng) : '';

    sheet.innerHTML =
      '<div class="grab"></div>' +
      '<div class="sh-kicker">D' + (di + 1) + ' · ' + fmtMD(d.date) + ' ' + weekdayCN(d.date) +
      (it.type && TYPE_LABEL[it.type] ? ' · ' + TYPE_LABEL[it.type] : '') + '</div>' +
      '<h2 class="sh-title">' + name + '</h2>' +
      '<div class="sh-meta">' +
      (it.time ? '<span class="pill">' + esc(it.time) + '</span>' : '') +
      (it.stay ? '<span class="pill">停留 ' + durationText(it.stay) + '</span>' : '') +
      (it.transit ? '<span class="pill">' + esc(it.transit) + '</span>' : '') +
      '</div>' +
      (it.note ? '<div class="sh-note">' + esc(it.note) + '</div>' : '') +
      (hasCoord ? '<div class="sh-coord">' + it.lat.toFixed(4) + ', ' + it.lng.toFixed(4) + '</div>' : '') +
      '<div class="sh-actions">' +
      (hasCoord
        ? '<a class="btn primary" href="https://www.google.com/maps/search/?api=1&query=' + gq + '" target="_blank" rel="noopener">在 Google 地图打开</a>' +
        '<a class="btn" href="https://www.google.com/maps/dir/?api=1&destination=' + gq + '" target="_blank" rel="noopener">导航到这里</a>'
        : '') +
      (it.name ? '<button class="btn wide" id="shCopyName">复制地点名</button>' : '') +
      '</div>';

    const bn = $('#shCopyName');
    if (bn) {
      bn.addEventListener('click', async () => {
        const ok = await copyText(it.name);
        toast(ok ? '已复制地点名' : '复制失败，请长按选择');
      });
    }

    sheet.classList.add('show');
    backdrop.classList.add('show');
    sheet.scrollTop = 0;
  }

  function openImage(src, caption) {
    sheet.innerHTML =
      '<div class="grab"></div>' +
      '<div class="sh-kicker">照片</div>' +
      '<img class="sh-img" src="' + src + '" alt="">' +
      (caption ? '<div class="sh-note">' + esc(caption) + '</div>' : '') +
      '<div class="sh-coord">照片来自 Wikimedia Commons（自由版权）</div>' +
      '<div class="sh-actions"><button class="btn wide" id="shClose">关闭</button></div>';
    const b = $('#shClose');
    if (b) b.addEventListener('click', closeSheet);
    sheet.classList.add('show');
    backdrop.classList.add('show');
    sheet.scrollTop = 0;
  }

  function openTextSheet(title, text) {
    sheet.innerHTML =
      '<div class="grab"></div>' +
      '<div class="sh-kicker">手动复制</div>' +
      '<h2 class="sh-title">' + esc(title) + '</h2>' +
      '<div class="sh-note" style="user-select:text;-webkit-user-select:text;white-space:pre-wrap;max-height:46vh;overflow:auto">' +
      esc(text) + '</div>' +
      '<div class="sh-actions"><button class="btn wide primary" id="shSelAll">全选文本</button></div>';
    const btn = $('#shSelAll');
    btn.addEventListener('click', () => {
      const box = sheet.querySelector('.sh-note');
      const range = document.createRange();
      range.selectNodeContents(box);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      toast('已全选，长按复制');
    });
    sheet.classList.add('show');
    backdrop.classList.add('show');
  }

  /* =====================================================================
   * 9. toast
   * ===================================================================== */
  let toastTimer = null;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
  }

  /* =====================================================================
   * 10. 视图切换 / 滚动监听
   * ===================================================================== */
  let currentView = 'overview';
  function switchView(name) {
    if (!name || name === currentView) return void syncTabs(name);
    currentView = name;
    ['overview', 'plan', 'map', 'guides', 'sky'].forEach(v => {
      const sec = document.getElementById('view-' + v);
      if (sec) sec.hidden = v !== name;
    });
    syncTabs(name);
    if (name === 'overview') renderOverview();
    if (name === 'map') renderMap();
    if (name === 'guides') renderGuides();
    if (name === 'sky') { renderSky(); loadWeather(); }
    window.scrollTo({ top: 0, behavior: 'auto' });
    try {
      const hash = name === 'map' && mapFilter !== null
        ? 'map-' + (mapFilter + 1)
        : name === 'plan' ? '' : name;
      history.replaceState(null, '', hash ? '#' + hash : location.pathname + location.search);
    } catch (e) { }
  }
  function syncTabs(name) {
    $('#tabs').querySelectorAll('button').forEach(b => {
      b.setAttribute('aria-selected', b.dataset.view === name ? 'true' : 'false');
    });
  }

  $('#tabs').addEventListener('click', e => {
    const b = e.target.closest('button[data-view]');
    if (b) switchView(b.dataset.view);
  });

  let scrollTick = false;
  window.addEventListener('scroll', () => {
    if (scrollTick || currentView !== 'plan') return;
    scrollTick = true;
    requestAnimationFrame(() => {
      scrollTick = false;
      const cards = document.querySelectorAll('.day');
      let best = 0, bestD = Infinity;
      const ref = 160;
      cards.forEach((c, i) => {
        const top = c.getBoundingClientRect().top;
        const d = Math.abs(top - ref);
        if (top - ref < 0) {
          const dd = Math.abs(top - ref);
          if (dd < bestD) { bestD = dd; best = i; }
        } else if (d < bestD) { bestD = d; best = i; }
      });
      if (best !== activeDay) {
        activeDay = best;
        document.querySelectorAll('#daystrip .chip').forEach((c, i) => c.classList.toggle('active', i === best));
        const chip = document.querySelectorAll('#daystrip .chip')[best];
        if (chip && chip.scrollIntoView) chip.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
      }
    });
  }, { passive: true });

  /* =====================================================================
   * 11. 今天
   * ===================================================================== */
  $('#btnToday').addEventListener('click', () => {
    const today = todayInTZ();
    const idx = (TRIP.days || []).findIndex(d => d.date === today);
    if (currentView !== 'plan') switchView('plan');
    if (idx >= 0) {
      const target = document.getElementById('day-' + idx);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      toast('今天 · D' + (idx + 1));
      return;
    }
    const first = TRIP.days[0];
    const last = TRIP.days[TRIP.days.length - 1];
    if (first && today < first.date) {
      toast('还没出发，还有 ' + dayDiff(today, first.date) + ' 天');
      const target = document.getElementById('day-0');
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else if (last) {
      toast('行程已结束');
      const target = document.getElementById('day-' + (TRIP.days.length - 1));
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else {
      toast('没有行程数据');
    }
  });

  /* =====================================================================
   * 12. 启动
   * ===================================================================== */
  function syncSticky() {
    const tb = document.querySelector('.topbar');
    if (!tb) return;
    const h = Math.round(tb.getBoundingClientRect().height);
    document.documentElement.style.setProperty('--topbar-h', h + 'px');
  }
  window.addEventListener('resize', syncSticky);
  window.addEventListener('orientationchange', () => setTimeout(syncSticky, 260));

  function boot() {
    if (!TRIP || !TRIP.days || !TRIP.days.length) {
      document.querySelector('main').innerHTML =
        '<div class="foot" style="padding:60px 20px;font-size:14px">没有读到行程数据。<br>请检查 trip-data.js 是否存在，并且定义了 window.TRIP。</div>';
      return;
    }
    $('#tbTitle').textContent = TRIP.title || '行程';
    $('#tbSub').textContent = TRIP.subtitle || '';
    document.title = (TRIP.title || '行程') + ' · 行程';
    renderOverview();
    renderTripCard();
    renderDayStrip();
    renderDays();
    renderMap();
    renderGuides();
    renderSky();
    syncSticky();
    $('#foot').innerHTML =
      '共 ' + TRIP.days.length + ' 天 · 数据在 trip-data.js，改完刷新即可<br>' +
      '日出日落按当地时间 ' + esc(TZ) + ' 计算';

    // 自动定位到今天
    const today = todayInTZ();
    const idx = TRIP.days.findIndex(d => d.date === today);
    if (idx > 0) {
      setTimeout(() => {
        const target = document.getElementById('day-' + idx);
        if (target) target.scrollIntoView({ block: 'start' });
        activeDay = idx;
        const chips = document.querySelectorAll('#daystrip .chip');
        if (chips[idx]) chips[idx].classList.add('active');
        if (chips[0]) chips[0].classList.remove('active');
      }, 120);
    }

    // 支持直接打开 #map / #map-3 / #sky
    const hash = (location.hash || '').replace('#', '');
    const md = /^map-(\d+)$/.exec(hash);
    if (md) {
      mapFilter = Math.min(Math.max(+md[1] - 1, 0), TRIP.days.length - 1);
      switchView('map');
    } else if (hash === 'overview' || hash === 'plan' || hash === 'map' || hash === 'sky' || hash === 'guides') {
      switchView(hash);
    }

    // service worker（仅安全上下文可用）
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      navigator.serviceWorker.register('sw.js').catch(() => { });
    }
  }

  boot();
})();
</script>
